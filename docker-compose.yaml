services:
  backend:
    build: ./backend
    container_name: flask-backend
    hostname: flask-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - app-networks

  frontend:
    build: ./frontend
    container_name: express-frontend
    hostname: express-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app-networks

networks:
  app-networks:
    driver: bridge
